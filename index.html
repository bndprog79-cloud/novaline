// ─────────── Акции ───────────
// Акция действует, пока сегодняшняя дата салона (company.timezone) не позже promo.until.
// Неверно заполненная акция (цена не меньше обычной, дата не ГГГГ-ММ-ДД) просто не показывается.
const ISO_DATE = /^\d{4}-\d{2}-\d{2}$/;
let dateFormat; // undefined — ещё не создан, null — недоступен
let promoDay = ''; // дата (ГГГГ-ММ-ДД), по которой нарисован экран

function pad2(n) { return (n < 10 ? '0' : '') + n; }

function salonToday(date) {
  if (dateFormat === undefined) {
    dateFormat = null;
    if (company.timezone && typeof Intl !== 'undefined' && Intl.DateTimeFormat) {
      try {
        dateFormat = new Intl.DateTimeFormat('en-US', {
          timeZone: company.timezone, year: 'numeric', month: '2-digit', day: '2-digit'
        });
        if (!dateFormat.formatToParts) dateFormat = null;
      } catch (e) { dateFormat = null; }
    }
  }
  if (dateFormat) {
    try {
      const p = {};
      dateFormat.formatToParts(date).forEach(function (x) { p[x.type] = x.value; });
      const iso = p.year + '-' + p.month + '-' + p.day;
      if (ISO_DATE.test(iso)) return iso;
    } catch (e) { /* ниже — дата устройства */ }
  }
  return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate());
}

// Варианты цены услуги (непустой массив, у каждого числовая amount) или null
function itemVariants(item) {
  const v = item.variants;
  if (!Array.isArray(v) || !v.length) return null;
  for (let i = 0; i < v.length; i++) {
    if (!v[i] || typeof v[i].amount !== 'number' || !(v[i].amount >= 0)) return null;
  }
  return v;
}

function minVariantAmount(variants) {
  return Math.min.apply(null, variants.map(function (v) { return v.amount; }));
}

// Действующая акция услуги или null (с вариантами цены акция не действует)
function activePromo(item) {
  if (itemVariants(item)) return null;
  const p = item.promo;
  if (!p || typeof p.amount !== 'number' || !(p.amount >= 0) || !(p.amount < item.price.amount)) return null;
  if (!ISO_DATE.test(String(p.until)) || promoDay > p.until) return null;
  return p;
}

// Цена с учётом акции: from и per — от обычной цены.
// С вариантами — «от <минимальный вариант>».
function effectivePrice(item) {
  const variants = itemVariants(item);
  if (variants) return { amount: minVariantAmount(variants), from: true, per: item.price.per };
  const p = activePromo(item);
  return p ? { amount: p.amount, from: item.price.from, per: item.price.per } : item.price;
}

function discountPercent(item, p) {
  return Math.round((item.price.amount - p.amount) / item.price.amount * 100);
}

function formatSaving(item, p) {
  let s = formatAmount(item.price.amount - p.amount);
  if (item.price.per) s += t('perPrefix') + loc(item.price.per);
  return s;
}

// Все действующие акции по порядку прайса
function activePromos() {
  const list = [];
  priceData.categories.forEach(function (cat) {
    cat.items.forEach(function (item) {
      const p = activePromo(item);
      if (p) list.push({ cat: cat, item: item, promo: p });
    });
  });
  return list;
}

function promoKey() {
  return activePromos().map(function (r) { return r.item.id; }).join(',');
}

// Наступил новый день и какая-то акция закончилась — перерисовать экран на месте
function refreshPromos() {
  const day = salonToday(new Date());
  if (day === promoDay) return;
  const before = promoKey();
  promoDay = day;
  if (currentRoute && promoKey() !== before) redraw();
}

// ─────────── Поиск ───────────
let searchQuery = '';

function normalize(s) {
  return String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim();
}

// Сначала совпадения в названии услуги, потом в названии категории, потом в описании
function searchItems(query) {
  const q = normalize(query);
  if (!q) return [];
  const groups = [[], [], []];
  priceData.categories.forEach(function (cat) {
    const inCat = normalize(loc(cat.name)).indexOf(q) !== -1;
    cat.items.forEach(function (item) {
      let g = -1;
      if (normalize(loc(item.name)).indexOf(q) !== -1) g = 0;
      else if (inCat) g = 1;
      else if (item.desc && normalize(loc(item.desc)).indexOf(q) !== -1) g = 2;
      if (g !== -1) groups[g].push({ cat: cat, item: item });
    });
  });
  return groups[0].concat(groups[1], groups[2]);
}

// ─────────── Построение DOM ───────────
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

function externalLink(className, href) {
  const a = el('a', className);
  a.href = href;
  a.target = '_blank';
  a.rel = 'noopener';
  return a;
}

// SVG берётся только из кода (ILLUSTRATIONS / ICONS), не из данных
function svgNode(markup) {
  const box = document.createElement('div');
  box.innerHTML = markup;
  return box.firstChild;
}

function illustration(key, className) {
  const box = el('div', 'ill ' + className);
  box.innerHTML = Object.prototype.hasOwnProperty.call(ILLUSTRATIONS, key) ? ILLUSTRATIONS[key] : ILL_PLACEHOLDER;
  return box;
}

function circleIcon(name, extra) {
  const span = el('span', 'circle' + (extra ? ' ' + extra : ''));
  span.innerHTML = ICONS[name];
  return span;
}

// Элемент появляется по очереди с соседями
function stagger(node, i) {
  node.classList.add('stagger');
  node.style.setProperty('--i', i);
  return node;
}

function hitBadge() { return el('span', 'hit', t('hit')); }

function durationLabel(minutes) {

function backLink(href, parentKey, text) {

  a.appendChild(el('span', null, text));
  a.addEventListener('click', function (e) {

function ornament() {

  o.setAttribute('aria-hidden', 'true');
  o.appendChild(el('span'));
  return o;
}

function discountBadge(item, p) {
  return el('span', 'promo-badge num', MINUS + discountPercent(item, p) + '%');

// Зачёркнутая старая цена (только сумма: «от» и « / ноготь» есть у новой цены рядом)
function oldPrice(item) {
  const text = formatAmount(item.price.amount);
  const del = el('del', 'old num', text);
  del.setAttribute('aria-label', t('oldPrice') + ' ' + text);
  return del;
}

// Новая цена и под ней старая
function promoPrice(item, className) {
  const box = el('div', className);
  box.appendChild(el('span', 'new', formatPrice(effectivePrice(item))));
  box.appendChild(oldPrice(item));

}

// Строка услуги: в списке категории — длительность и «Хит», в поиске — название категории
function serviceRow(cat, item, withCategory) {
  const promo = activePromo(item);
  const row = el('a', 'row');
  row.href = itemHash(cat, item);
  row.appendChild(illustration(item.illustration, 'ill-mini'));
  const info = el('div', 'info');
  info.appendChild(el('div', 'name', loc(item.name)));
  if (withCategory) {
    info.appendChild(el('div', 'cat', loc(cat.name)));
    if (promo) {
      const meta = el('div', 'meta');
      meta.appendChild(discountBadge(item, promo));
      info.appendChild(meta);
    }

    const meta = el('div', 'meta');
    if (item.duration) meta.appendChild(durationLabel(item.duration));
    if (item.hit) meta.appendChild(hitBadge());

  row.appendChild(info);
  if (promo) row.appendChild(promoPrice(item, 'price num is-promo'));
  else row.appendChild(el('div', 'price num', formatPrice(effectivePrice(item))));

// ─────────── Варианты цены ───────────
// Выбранный вариант (номер в массиве) по ключу «категория/услуга» — только в памяти страницы:
// сохраняется при смене языка и «Назад», после перезагрузки ничего не выбрано
const chosenVariants = {};

// Цена варианта: «6 000 ₸» (+ « / ноготь», если у услуги есть per)

  let s = formatAmount(v.amount);

// Ссылка записи: вариант выбран → шаблон с вариантом; акция → шаблон акции; иначе обычный

// Ссылка онлайн-записи: своя у категории приоритетнее общей; только http/https, иначе ссылки нет
function httpUrl(u) { return typeof u === 'string' && /^https?:\/\/\S+$/i.test(u.trim()) ? u.trim() : ''; }

function bookingUrl(cat) {
  return httpUrl(cat.bookingUrl) || httpUrl(company.booking && company.booking.url);

// Таблица вариантов с выбором (радиокнопки, по умолчанию ничего не выбрано)
function variantsBlock(cat, item, variants, chosen, onChoose) {
  const box = el('fieldset', 'variants');
  box.appendChild(el('legend', null, t('variantsTitle')));
  const hint = el('p', 'hint', t('chooseVariant'));
  hint.id = 'vh-' + cat.id + '-' + item.id;
  box.setAttribute('aria-describedby', hint.id);
  box.appendChild(hint);
  const opts = el('div', 'opts');
  const labels = [];
  variants.forEach(function (v) {
    const label = el('label', 'opt');
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'variant-' + cat.id + '-' + item.id;
    input.checked = v === chosen;
    if (input.checked) label.classList.add('is-checked');
    input.addEventListener('change', function () {
      if (!input.checked) return;
      labels.forEach(function (l) { l.classList.toggle('is-checked', l === label); });
      onChoose(v);
    });
    label.appendChild(input);
    label.appendChild(el('span', 'vname', loc(v.name)));
    label.appendChild(el('span', 'vprice num', variantPrice(item, v)));
    labels.push(label);
    opts.appendChild(label);
  });

// Кнопка-иконка: подпись для диктора и подсказка — из ui
function iconButton(icon, className, label, onClick) {
  const b = el('button', 'icon-btn ' + className);
  b.type = 'button';
  b.setAttribute('aria-label', label);
  b.title = label;
  b.appendChild(svgNode(ICONS[icon]));
  b.addEventListener('click', onClick);
  return b;
}

// Ссылка всегда на сайт (и при открытии файлом), с меткой источника; из карточки — прямо на услугу
function shareUrl(cat, item) {
  return priceData.meta.siteUrl + '?src=share' + (item ? itemHash(cat, item) : '');
}

// Системное меню → копирование в буфер (+ уведомление) → WhatsApp
function shareLink(cat, item) {
  const url = shareUrl(cat, item);
  const text = fill(t('shareText'), { name: company.name });
  if (navigator.share) {
    navigator.share({ title: document.title, text: text, url: url }).catch(function (e) {
      if (e && e.name === 'AbortError') return; // человек закрыл меню
      copyLink(url, text);
    });
    return;
  }
  copyLink(url, text);
}

function copyLink(url, text) {
  function legacy() {
    if (legacyCopy(url)) showToast(t('linkCopied'));
    else window.open('https://wa.me/?text=' + encodeURIComponent(text + ' ' + url), '_blank', 'noopener');
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () { showToast(t('linkCopied')); }, legacy);
      return;
    }
  } catch (e) { /* ниже — запасной способ */ }
  legacy();
}

// Старый способ копирования (браузеры без navigator.clipboard)
function legacyCopy(value) {
  const area = el('textarea');
  area.value = value;
  area.setAttribute('readonly', '');
  area.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
  document.body.appendChild(area);
  let ok = false;
  try {
    area.select();
    area.setSelectionRange(0, value.length);
    ok = document.execCommand('copy');
  } catch (e) { ok = false; }
  document.body.removeChild(area);
  return ok;
}

let toastTimer = null;
function showToast(text) {
  let toast = document.querySelector('.toast');
  if (!toast) {
    toast = el('div', 'toast');
    toast.setAttribute('role', 'status');
    toast.setAttribute('aria-live', 'polite');
    document.body.appendChild(toast);
    toast.offsetWidth; // чтобы появление было плавным
  }
  toast.textContent = text;
  toast.classList.toggle('is-above-bar', !!document.querySelector('.book-bar'));
  toast.classList.toggle('has-booking', !!document.querySelector('.book-bar.has-booking'));
  toast.classList.add('is-shown');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toast.classList.remove('is-shown'); }, 2000);
}

// ─────────── Окно «QR-код» ───────────
// Открытие добавляет запись в историю (адрес тот же) — системная «Назад» закрывает окно.
let qrModal = null;
let qrOpener = null;

function openQr(opener) {
  if (qrModal) return;
  qrOpener = opener;
  const modal = el('div', 'qr-modal');
  const dialog = el('div', 'qr-dialog');
  dialog.setAttribute('role', 'dialog');
  dialog.setAttribute('aria-modal', 'true');
  dialog.setAttribute('aria-labelledby', 'qr-title');
  dialog.setAttribute('aria-describedby', 'qr-hint');
  const close = iconButton('close', 'qr-close', t('close'), function () { closeQr(); });
  const box = el('div', 'qr-box');
  box.appendChild(svgNode(QR_SVG));
  const name = el('p', 'qr-name', company.name);
  name.id = 'qr-title';
  const hint = el('p', 'qr-hint', t('qrHint'));
  hint.id = 'qr-hint';
  dialog.appendChild(close);
  dialog.appendChild(box);
  dialog.appendChild(name);
  dialog.appendChild(hint);
  modal.appendChild(dialog);
  modal.addEventListener('click', function (e) {
    if (e.target === modal) closeQr(); // нажатие на фон
  });
  modal.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      e.preventDefault();
      closeQr();
    } else if (e.key === 'Tab') {
      // Фокус не выходит из окна
      const items = dialog.querySelectorAll('button, [href]');
      const first = items[0];
      const last = items[items.length - 1];
      if (e.shiftKey ? document.activeElement === first : document.activeElement === last) {
        e.preventDefault();
        (e.shiftKey ? last : first).focus();
      }
    }
  });
  document.body.appendChild(modal);
  qrModal = modal;
  document.getElementById('app').setAttribute('aria-hidden', 'true');
  document.documentElement.style.overflow = 'hidden';
  try { history.pushState({ idx: currentIdx, qr: true }, ''); } catch (e) { /* без записи «Назад» не закроет окно */ }
  close.focus();
}

// fromHistory — окно закрыла системная «Назад» (запись истории уже снята)
function closeQr(fromHistory) {
  if (!qrModal) return;
  if (!fromHistory && history.state && history.state.qr) {
    history.back(); // окно закроется в обработчике popstate
    return;
  }
  qrModal.parentNode.removeChild(qrModal);
  qrModal = null;
  document.getElementById('app').removeAttribute('aria-hidden');
  document.documentElement.style.overflow = '';
  // Экран могли перерисовать (смена дня) — тогда фокус на новую кнопку
  const target = qrOpener && document.contains(qrOpener) ? qrOpener : document.querySelector('.qr-btn');
  qrOpener = null;
  if (target) target.focus({ preventScroll: true });
}

function onPopState() {
  if (qrModal && !(history.state && history.state.qr)) closeQr(true);
}

// Фокус ушёл за пределы открытого окна (например, кликом) — вернуть в окно
function keepFocusInQr(e) {
  if (qrModal && !qrModal.contains(e.target)) {
    const close = qrModal.querySelector('.qr-close');
    if (close) close.focus();
  }
}

// ─────────── Маршрутизация ───────────
// #/ — главная, #/c/<catId> — категория, #/s/<catId>/<itemId> — услуга
function findById(list, id) {
  for (let i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
  return null;
}

function safeDecode(s) {
  try { return decodeURIComponent(s); } catch (e) { return s; }
}

function parseRoute(hash) {
  const parts = (hash || '').replace(/^#\/?/, '').split('/').filter(Boolean).map(safeDecode);
  if (parts.length === 0) return { screen: 'home', key: 'home' };
  if (parts[0] === 'c' && parts.length === 2) {
    const cat = findById(priceData.categories, parts[1]);
    if (cat) return { screen: 'cat', key: 'c/' + cat.id, cat: cat };
  }
  if (parts[0] === 's' && parts.length === 3) {
    const cat = findById(priceData.categories, parts[1]);
    const item = cat ? findById(cat.items, parts[2]) : null;
    if (item) return { screen: 'item', key: 's/' + cat.id + '/' + item.id, cat: cat, item: item };
  }
  return null;
}

// Номер записи истории хранится в history.state.idx:
// меньше текущего — это «назад» (восстановить прокрутку), иначе — «вперёд» (наверх).
let currentIdx = 0;
let currentRoute = null;
const scrollPositions = {};
const routeKeys = {};

// direction: 'fwd' | 'back' | null (без анимации экрана, например смена языка)
function render(route, direction) {
  const app = document.getElementById('app');
  app.textContent = '';
  const screen = el('div', 'screen');
  app.appendChild(screen);
  if (route.screen === 'cat') renderCategory(screen, route.cat);
  else if (route.screen === 'item') renderItem(screen, route.cat, route.item, app);
  else renderHome(screen);

  if (direction) {
    screen.classList.add(direction === 'back' ? 'enter-back' : 'enter-fwd');
    // После въезда снимаем класс, чтобы на экране не оставалось transform
    screen.addEventListener('animationend', function done(e) {
      if (e.target !== screen) return;
      screen.classList.remove('enter-fwd', 'enter-back');
      screen.removeEventListener('animationend', done);
    });
  } else {
    // Без анимации экрана — и без поочерёдного появления элементов
    const items = screen.querySelectorAll('.stagger');
    for (let i = 0; i < items.length; i++) items[i].classList.remove('stagger');
    const drawn = screen.querySelector('.draw');
    if (drawn) drawn.classList.remove('draw');
    const bar = app.querySelector('.book-bar');
    if (bar) bar.style.animation = 'none';
  }
}

function onRoute() {
  let route = parseRoute(location.hash);
  const unknown = !route;
  if (unknown) route = { screen: 'home', key: 'home' };

  const state = history.state;
  let idx;
  let isBack = false;
  if (state && typeof state.idx === 'number') {
    idx = state.idx;
    isBack = idx < currentIdx;
  } else {
    idx = currentIdx + 1;
  }
  // Неизвестный адрес → главная, без лишней записи в истории
  if (unknown) history.replaceState({ idx: idx }, '', '#/');
  else history.replaceState({ idx: idx }, '');

  currentIdx = idx;
  currentRoute = route;
  routeKeys[idx] = route.key;
  render(route, isBack ? 'back' : 'fwd');
  window.scrollTo(0, isBack ? (scrollPositions[idx] || 0) : 0);
}

// Перерисовать текущий экран на месте: без анимации, прокрутка сохраняется
function redraw() {
  const y = window.pageYOffset;
  const inSearch = document.activeElement && document.activeElement.type === 'search';
  render(currentRoute, null);
  window.scrollTo(0, y);
  if (inSearch) {
    const input = document.querySelector('.search input');
    if (input) input.focus({ preventScroll: true });
  }
}

function setLang(code) {
  if (code === lang) return;
  lang = code;
  saveLang(code);
  document.documentElement.lang = code;
  const hadFocus = document.activeElement && document.activeElement.closest && document.activeElement.closest('.lang');
  redraw();
  if (hadFocus) {
    const btn = document.querySelector('.lang button[lang="' + code + '"]');
    if (btn) btn.focus({ preventScroll: true });
  }
}

// ─────────── PWA: только на сайте (http/https) ───────────
// Manifest и значок подключаются отсюда, а не в <head>: при открытии файлом (file://)
// браузер не может их прочитать и пишет ошибку в консоль.
function setupPwa() {
  if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
  try {
    const links = [['manifest', 'manifest.webmanifest'], ['icon', 'icons/icon-192.png']];
    links.forEach(function (l) {
      const link = document.createElement('link');
      link.rel = l[0];
      link.href = l[1];
      document.head.appendChild(link);
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  } catch (e) { /* без PWA прайс работает как обычная страница */ }
}

// promo и variants в одной услуге не поддерживаются: действует только variants
// (сообщение для того, кто правит данные; на экране ошибки нет)
function warnPromoWithVariants() {
  priceData.categories.forEach(function (cat) {
    cat.items.forEach(function (item) {
      if (item.promo && itemVariants(item) && window.console) {
        console.warn('priceData: услуга "' + item.id + '" — указаны и promo, и variants; promo не действует.');
      }
    });
  });
}

function kPlural(forms, n) {

// У группы может быть своя цена (price, с разовым single), длительность и «раз в неделю» — иначе как у кружка

// ─────────── Расписание ───────────
// Вкладка «Жс» — только у кружка, у которого есть занятия в воскресенье (в программе — если такой кружок выбран)
function hasSun(item) {
  return !!((item.schedule && item.schedule.sun) || (item.groups || []).some(function (g) { return g.schedule && g.schedule.sun; }));
}
function daysShown(items) { return items.some(hasSun) ? 7 : 6; }
// Дни без часов (schedule: { tue: [] }) — «время назначается индивидуально»
function indivDays(item, gid) {

  return KDAYS.filter(function (d) { return Array.isArray(sch[d]) && !sch[d].length; });
}
function indivText(item, gid, sep) {
  const ds = indivDays(item, gid);
  return ds.length ? fill(t('daysTimeIndividual'), { days: ds.map(function (d) { return t('daysShort')[KDAYS.indexOf(d)]; }).join(sep) }) : '';
}

function findGroup(item, gid) {
  const gs = item.groups || [];
  for (let i = 0; i < gs.length; i++) if (gs[i].id === gid) return gs[i];
  return gs[0] || null;
}
function scheduleOf(item, gid) {
  const g = findGroup(item, gid);

}
// Группа по возрасту ребёнка (или чипу): первая, чей возраст подходит
function groupFor(item, years, chipId) {
  const gs = item.groups || [];
  const a = chipById(chipId);
  for (let i = 0; i < gs.length; i++) {
    const g = gs[i];
    if (!g.age) continue;
    if (years && g.age[0] <= years && g.age[1] >= years) return g.id;
    if (!years && a && !a.adult && g.age[0] <= a.to && g.age[1] >= a.from) return g.id;

}
function slotStart(s) { return String(s).split('–')[0]; }

// Время по умолчанию: первое время первого дня; дни, где есть это же время, — до perWeek; не хватает — первое время других дней
function defaultSlots(item, gid) {
  const sch = scheduleOf(item, gid);
  const days = KDAYS.filter(function (d) { return sch[d] && sch[d].length; });
  const out = {};
  if (!days.length) return out;
  const want = perWeekOf(item, gid) > 0 ? perWeekOf(item, gid) : 1;
  const first = slotStart(sch[days[0]][0]);
  let n = 0;
  days.forEach(function (d) {
    if (n >= want) return;
    for (let i = 0; i < sch[d].length; i++) if (slotStart(sch[d][i]) === first) { out[d] = sch[d][i]; n++; return; }
  });
  days.forEach(function (d) {
    if (n >= want || out[d]) return;
    out[d] = sch[d][0];
    n++;
  });
  return out;
}

// Разово — одно занятие: день из дней кружка (и дни без часов), по умолчанию ближайший от сегодня (сегодня тоже)
function classDays(item, gid) {

  return KDAYS.filter(function (d) { return Array.isArray(sch[d]); });
}

// ─────────── Программа ребёнка ───────────
// { cur: номер ребёнка, kids: [{ name, age, trial, items: [{ c: направление, i: кружок, g: группа, slots: { mon: "09:00–10:00" },
//   m: "single" — разово (только у кружка с price.single; нет — абонемент), d: день разового (slots — не больше одного, этого дня) }] }] }

function newKid() { return { name: '', age: 0, trial: !!TRIAL, items: [] }; }

function loadProgram() {

  if (raw && Array.isArray(raw.kids)) {
    raw.kids.slice(0, KIDS_MAX).forEach(function (k) {
      if (!k || typeof k !== 'object') return;
      const kid = newKid();
      kid.name = typeof k.name === 'string' ? k.name.slice(0, 40) : '';
      kid.age = Number.isInteger(k.age) && k.age >= 1 && k.age <= 18 ? k.age : 0;
      if (typeof k.trial === 'boolean') kid.trial = k.trial && !!TRIAL;
      (Array.isArray(k.items) ? k.items : []).forEach(function (e) {
        if (!e || typeof e.c !== 'string' || typeof e.i !== 'string') return;

        const slots = {};

        }

// Строки программы с кружками: [{ e, cat, item }]

  });
  return out;
}

// Итог в месяц: кружки «в месяц» (абонемент); скидка на второй кружок — на все, кроме самого дорогого; на второго ребёнка — на весь итог.

function programTotals(kidIdx) {
  const kid = program.kids[kidIdx];
  const lines = programLines(kid);
  const month = lines.filter(function (l) { return priceOf(l.item, l.e.g).unit === 'month' && !isSingle(l); })
    .map(function (l) { return priceOf(l.item, l.e.g).amount; });
  const sum = month.reduce(function (s, a) { return s + a; }, 0);
  let off = 0;
  const notes = [];

    const sorted = month.slice().sort(function (a, b) { return b - a; });
    const d = sorted.slice(1).reduce(function (s, a) { return s + Math.round(a * DISCOUNTS.secondClub / 100); }, 0);
    off += d;

  }
  if (DISCOUNTS.secondChild && kidIdx > 0 && sum - off > 0) {
    const d = Math.round((sum - off) * DISCOUNTS.secondChild / 100);

// Текст записи в WhatsApp на текущем языке

  if (name || kid.age) {
    const age = kid.age ? yearsText(kid.age) : '';
    out.push(name ? fill(t('msgChild'), { name: name, age: age }).replace(', .', '.') : fill(t('msgChildNoName'), { age: age }));
  }
  programLines(kid).forEach(function (l, i) {
    const g = (l.item.groups || []).length ? findGroup(l.item, l.e.g) : null;
    const parts = [];
    if (isSingle(l)) {
      // «Каратэ — бір реттік сабақ — Сс 18:00–19:00 — 2 500 ₸»; день без часов — «Сб: уақыты жеке белгіленеді»
      const dn = l.e.d ? t('daysShort')[KDAYS.indexOf(l.e.d)] : '';
      const when = !dn ? noDaysText(l.item) : l.e.slots[l.e.d] ? dn + ' ' + l.e.slots[l.e.d] : fill(t('daysTimeIndividual'), { days: dn });
      parts.push(fill(t('msgSingle'), { when: when, price: formatAmount(priceOf(l.item, l.e.g).single) }));
    } else {
      const times = slotsText(l.item, l.e);
      if (times) parts.push(times);
      const indiv = indivText(l.item, l.e.g, ', ');
      if (indiv) parts.push(indiv);
      if (!classDays(l.item, l.e.g).length && l.item.schedule) parts.push(noDaysText(l.item));
      parts.push(priceText(l.item, l.e.g));
    }
    out.push(fill(t('msgLine'), { n: i + 1, name: loc(l.item.name) + (g ? ' (' + t('group') + ' ' + loc(g.name) + ')' : ''), details: parts.join(' — ') }));
  });
  if (TRIAL) out.push(t(kid.trial ? 'msgTrialYes' : 'msgTrialNo'));
  if (tot.sum) {
    out.push(fill(t('msgTotal'), { sum: formatAmount(tot.total) }));
    if (tot.notes.length) out.push(fill(t('msgDiscount'), { list: tot.notes.map(function (x) { return x.text; }).join(', ') }));
  }
  return out.join('\n');
}

// Мягкие переносы (U+00AD) в длинных словах — по слогам: «Шы­ғар­ма­шы­лық», «Об­ра­зо­ва­ни­е». На узкой плитке слово
// переносится с дефисом, а не рвётся в случайном месте. Перед согласной между гласными; из группы согласных — перед последней;
// й, ь, ъ остаются в конце слога; от начала не меньше 2 букв, в конце не меньше 3.
const KVOWELS = 'аәеёиоөуұүыіэюяaeiouy';
function softHyphens(text) {
  return text.split(' ').map(function (w) {
    if (w.length < 8) return w;
    const low = w.toLowerCase();
    const vow = [];
    for (let i = 0; i < low.length; i++) if (KVOWELS.indexOf(low[i]) >= 0) vow.push(i);
    const cuts = [];
    for (let k = 1; k < vow.length; k++) {
      const a = vow[k - 1], b = vow[k];
      if (b - a < 2) continue;
      let p = b - a === 2 ? a + 1 : b - 1;
      if ('йьъ'.indexOf(low[p]) >= 0) p++;
      if (p >= 2 && w.length - p >= 3) cuts.push(p);
    }
    let out = '', from = 0;
    cuts.forEach(function (p) { out += w.slice(from, p) + '­'; from = p; });
    return out + w.slice(from);
  }).join(' ');
}

// Выбранная группа и день — в памяти страницы (по ключу «направление/кружок»)
const kView = {};
function viewState(cat, item) {
  const key = cat.id + '/' + item.id;
  return kView[key] || (kView[key] = { g: groupFor(item, curKid().age, kAge), d: -1 });
}

function scheduleBlock(cat, item) {
  const st = viewState(cat, item);
  const box = el('section', 'ksec');
  const head = el('div', 'ksec-head');
  head.appendChild(el('h2', null, t('schedule')));
  box.appendChild(head);
  const sch = scheduleOf(item, st.g);
  const shown = daysShown([item]);
  // День с занятиями — есть время или день без часов ([] — время индивидуально)
  const has = KDAYS.map(function (d) { return Array.isArray(sch[d]); });
  if (!has.some(Boolean)) {
    box.appendChild(el('p', 'knote', noDaysText(item)));
    return box;
  }
  if ((item.groups || []).length > 1) {
    const gs = el('div', 'kgroups');
    gs.setAttribute('role', 'group');
    gs.setAttribute('aria-label', t('group'));
    item.groups.forEach(function (g) {
      const b = el('button', null, t('group') + ' ' + loc(g.name));
      b.type = 'button';
      b.setAttribute('aria-pressed', g.id === st.g ? 'true' : 'false');
      b.addEventListener('click', function () { st.g = g.id; st.d = -1; redraw(); });
      gs.appendChild(b);
    });
    box.appendChild(gs);
  }
  // День: выбранный, иначе сегодня (если в этот день есть занятия), иначе первый день с занятиями
  if (st.d < 0 || !has[st.d]) {
    const today = salonClock(new Date()).day - 1;
    st.d = has[today] && today < shown ? today : has.indexOf(true);
  }
  const days = el('div', 'kdays');
  days.style.setProperty('--n', shown);
  t('daysShort').slice(0, shown).forEach(function (name, i) {
    const b = el('button', has[i] ? 'has' : null, name);
    b.type = 'button';
    b.setAttribute('aria-pressed', i === st.d ? 'true' : 'false');
    b.addEventListener('click', function () { st.d = i; redraw(); });
    days.appendChild(b);
  });
  box.appendChild(days);
  const slots = el('div', 'kslots');
  slots.setAttribute('aria-live', 'polite');
  const list = sch[KDAYS[st.d]] || [];
  if (!list.length) slots.appendChild(el('p', 'knote', t(Array.isArray(sch[KDAYS[st.d]]) ? 'timeIndividual' : 'noClassDay')));
  list.forEach(function (s) {
    const r = el('div', 'kslot');
    r.appendChild(svgNode(ICONS.clock));
    r.appendChild(el('b', 'num', s));
    slots.appendChild(r);
  });
  box.appendChild(slots);
  if (company.scheduleNote) box.appendChild(el('p', 'knote', loc(company.scheduleNote)));
  return box;
}

function programItem(kid, l, i) {
  const box = stagger(el('div', 'kpc ' + tint(l.cat)), i);
  const top = el('div', 'kpc-top');
  top.appendChild(clubArt(l.cat, l.item, 'ill-mini'));
  const g = el('div', 'grow');
  const name = el('a', null);
  name.href = itemHash(l.cat, l.item);
  name.appendChild(el('b', null, loc(l.item.name)));
  g.appendChild(name);
  g.appendChild(el('small', null, ageText(l.item) + ' · ' + freqText(l.item, l.e.g) + (kid.age && !fitsAge(l.item, kid.age) ? ' · ' + t('notForAge') : '')));
  top.appendChild(g);
  top.appendChild(el('span', 'pr num', linePrice(l)));
  const del = el('button', 'kdel');
  del.type = 'button';
  del.setAttribute('aria-label', t('remove') + ': ' + loc(l.item.name));
  del.title = t('remove');
  del.appendChild(svgNode(ICONS.trash));
  del.addEventListener('click', function () {
    kid.items.splice(kid.items.indexOf(l.e), 1);
    saveProgram();
    redraw();
  });
  top.appendChild(del);
  box.appendChild(top);
  if ((l.item.groups || []).length > 1) {
    const gs = el('div', 'kgroups');
    gs.setAttribute('role', 'group');
    gs.setAttribute('aria-label', t('group'));
    l.item.groups.forEach(function (gr) {
      const b = el('button', null, t('group') + ' ' + loc(gr.name));
      b.type = 'button';
      b.setAttribute('aria-pressed', gr.id === l.e.g ? 'true' : 'false');
      b.addEventListener('click', function () {
        if (l.e.g === gr.id) return;
        l.e.g = gr.id;
        l.e.slots = defaultSlots(l.item, gr.id);
        if (!priceOf(l.item, gr.id).single) delete l.e.m;
        if (l.e.m) singlePick(l.e, l.item, nearestDay(l.item, gr.id)); else delete l.e.d;
        saveProgram();
        redraw();
      });
      gs.appendChild(b);
    });
    box.appendChild(gs);
  }
  // Абонемент / Бір рет — у кружка (группы) с разовой ценой; по умолчанию абонемент
  if (priceOf(l.item, l.e.g).single) {
    const ms = el('div', 'kgroups kmode');
    ms.setAttribute('role', 'group');
    ms.setAttribute('aria-label', loc(l.item.name) + ': ' + t('subscription') + ' / ' + t('modeSingle'));
    [['', t('modeMonth')], ['single', t('modeSingle')]].forEach(function (m) {
      const b = el('button', null, m[1]);
      b.type = 'button';
      b.setAttribute('aria-pressed', (l.e.m || '') === m[0] ? 'true' : 'false');
      b.addEventListener('click', function () {
        if ((l.e.m || '') === m[0]) return;
        // Абонемент → Бір рет: группа та же, ближайший день; обратно — дни по умолчанию
        if (m[0]) {
          l.e.m = m[0];
          const d = nearestDay(l.item, l.e.g);
          singlePick(l.e, l.item, d, l.e.slots[d]);
        } else {
          delete l.e.m;
          delete l.e.d;
          l.e.slots = defaultSlots(l.item, l.e.g);
        }
        saveProgram();
        redraw();
      });
      ms.appendChild(b);
    });
    box.appendChild(ms);
  }
  const sch = scheduleOf(l.item, l.e.g);
  // Бір рет — одно занятие: «Күні» (дни кружка) и «Уақыты» этого дня; день без часов — «уақыты жеке белгіленеді»
  if (isSingle(l)) {
    const ds = classDays(l.item, l.e.g);
    if (!ds.length) {
      box.appendChild(el('p', 'knote', noDaysText(l.item)));
      return box;
    }
    const grid = el('div', 'ktimes');
    const dayLab = el('label');
    dayLab.appendChild(el('span', null, t('singleDay')));
    const dsel = el('select');
    dsel.setAttribute('aria-label', loc(l.item.name) + ', ' + t('singleDay'));
    ds.forEach(function (d) {
      const o = el('option', null, t('daysShort')[KDAYS.indexOf(d)]);
      o.value = d;
      if (d === l.e.d) o.selected = true;
      dsel.appendChild(o);
    });
    dsel.addEventListener('change', function () {
      singlePick(l.e, l.item, dsel.value, l.e.slots[l.e.d]);
      saveProgram();
      redraw();
    });
    dayLab.appendChild(dsel);
    grid.appendChild(dayLab);
    const list = sch[l.e.d] || [];
    if (list.length) {
      const timeLab = el('label');
      timeLab.appendChild(el('span', null, t('singleTime')));
      const tsel = el('select');
      tsel.setAttribute('aria-label', loc(l.item.name) + ', ' + t('singleTime'));
      list.forEach(function (s) {
        const o = el('option', null, s);
        o.value = s;
        if (l.e.slots[l.e.d] === s) o.selected = true;
        tsel.appendChild(o);
      });
      tsel.addEventListener('change', function () {
        singlePick(l.e, l.item, l.e.d, tsel.value);
        saveProgram();
        redraw();
      });
      timeLab.appendChild(tsel);
      grid.appendChild(timeLab);
    }
    box.appendChild(grid);
    if (!list.length) box.appendChild(el('p', 'knote', t('timeIndividual')));
    return box;
  }
  // Время по дням: «—» — в этот день не ходит; дни без часов — одной строкой «Сс · Сб: уақыты жеке белгіленеді»
  const days = KDAYS.filter(function (d) { return sch[d] && sch[d].length; });
  const indiv = indivText(l.item, l.e.g, ' · ');
  if (indiv) box.appendChild(el('p', 'knote', indiv));
  if (days.length) {
    const grid = el('div', 'ktimes');
    days.forEach(function (d) {
      const lab = el('label');
      lab.appendChild(el('span', null, t('daysShort')[KDAYS.indexOf(d)]));
      const sel = el('select');
      sel.setAttribute('aria-label', loc(l.item.name) + ', ' + t('daysShort')[KDAYS.indexOf(d)]);
      [''].concat(sch[d]).forEach(function (s) {
        const o = el('option', null, s || t('dayNone'));
        o.value = s;
        if ((l.e.slots[d] || '') === s) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener('change', function () {
        if (sel.value) l.e.slots[d] = sel.value; else delete l.e.slots[d];
        saveProgram();
        redraw();
      });
      lab.appendChild(sel);
      grid.appendChild(lab);
    });
    box.appendChild(grid);
    const n = Object.keys(l.e.slots).length;
    const pw = perWeekOf(l.item, l.e.g);
    if (pw > 0 && n !== pw) box.appendChild(el('p', 'knote', fill(t('perWeekNote'), { times: timesText(pw) })));
  } else if (!indiv) box.appendChild(el('p', 'knote', noDaysText(l.item)));
  return box;
}

function weekGrid(lines) {
  const box = el('div', 'kweek');
  const shown = daysShown(lines.map(function (l) { return l.item; }));
  const days = t('daysShort').slice(0, shown);
  const head = el('div', 'kwrow');
  head.style.setProperty('--n', shown);
  head.appendChild(el('span'));
  let lessons = 0, singles = 0;
  // Разовое — одна ячейка (пунктир), у дня без часов — без времени; в «Аптасына N сабақ» не входит
  const on = function (l, d) { return !!l.e.slots[d] || (isSingle(l) && l.e.d === d); };
  days.forEach(function (name, i) {
    const busy = lines.some(function (l) { return on(l, KDAYS[i]); });
    head.appendChild(el('span', 'kwh' + (busy ? ' busy' : ''), name));
  });
  box.appendChild(head);
  lines.forEach(function (l) {
    const row = el('div', 'kwrow ' + tint(l.cat));
    row.style.setProperty('--n', shown);
    row.appendChild(el('span', 'kwn', loc(l.item.name)));
    const one = isSingle(l);
    days.forEach(function (name, i) {
      const s = l.e.slots[KDAYS[i]];
      const o = on(l, KDAYS[i]);
      if (o && one) singles++; else if (o) lessons++;
      row.appendChild(el('span', 'kwc num' + (o ? ' on' : '') + (o && one ? ' one' : ''), s ? slotStart(s) : ''));
    });
    box.appendChild(row);
  });
  return { box: box, lessons: lessons, singles: singles };
}

const parseRouteSalon = parseRoute;
parseRoute = function (hash) {
  const parts = (hash || '').replace(/^#\/?/, '').split('/').filter(Boolean);
  if (parts.length === 1 && parts[0] === 'program') return { screen: 'program', key: 'program' };
  if (parts.length === 1 && parts[0] === 'adult') return { screen: 'adult', key: 'adult' };
  return parseRouteSalon(hash);
};

// render() рисует неизвестный ему экран как главную — здесь вместо неё программа или «Ересектерге»
renderHome = function (screen) {
  const s = currentRoute && currentRoute.screen;
  if (s === 'program') renderProgram(screen, document.getElementById('app'));
  else if (s === 'adult') renderAdult(screen);
  else renderKidsHome(screen);
};

// Картинка фото: lazy (src сразу) или по запросу (src позже, load()); fail — не загрузилась
function kpImg(i, suffix, fail, later) {
  const img = el('img', 'kph');
  img.alt = '';
  img.decoding = 'async';
  img.style.objectPosition = kpFocus(i);
  img.addEventListener('error', function () { if (fail) fail(img); });
  if (later) img.dataset.src = kpSrc(i, suffix);
  else {
    img.loading = 'lazy';
    img.src = kpSrc(i, suffix);
  }
  return img;
}
function kpLoad(img) {
  if (img && img.dataset.src) {
    img.src = img.dataset.src;
    delete img.dataset.src;
  }
}

// Фото поверх рисунка в той же рамке
function photoOver(box, i, suffix) {
  box.classList.add('has-photo');
  box.insertBefore(kpImg(i, suffix, function (img) {
    if (img.parentNode) img.parentNode.removeChild(img);
    box.classList.remove('has-photo');
  }), box.firstChild);
  return box;
}

// Все фото по порядку списка, у каждого — первый кружок с этим фото (подпись в просмотре)
function albumList() {
  const out = KIDS_PHOTOS.f.map(function (f, i) { return { i: i, cat: null, item: null }; });
  priceData.categories.forEach(function (cat) {
    cat.items.forEach(function (item) {
      clubPhotos(cat, item).forEach(function (i) {
        if (!out[i].item) { out[i].cat = cat; out[i].item = item; }
      });
    });
  });
  return out.filter(function (x) { return x.item; });
}

// ── Рисунок кружка → фото ──
const clubArtPlain = clubArt;
clubArt = function (cat, item, cls) {
  const box = clubArtPlain(cat, item, cls);
  const list = clubPhotos(cat, item);
  if (list.length && !/ill-hero/.test(cls)) photoOver(box, list[0], /ill-mini/.test(cls) ? '-m' : '-t');
  return box;
};

// ── Листание: дорожка со «щелчком» по кадру, точки (если фото больше одного), стрелки (на компьютере) ──
function kpSlider(list, suffix, onOpen) {
  const wrap = el('div', 'kslider');
  const track = el('div', 'kslides');
  const dots = el('div', 'kdots');
  dots.setAttribute('aria-hidden', 'true');
  list.forEach(function (i) {
    const b = el('button', 'kslide');
    b.type = 'button';
    b.appendChild(kpImg(i, suffix, function () { drop(b); }, true));
    b.addEventListener('click', function () {
      onOpen(slides().indexOf(b), slides().map(function (s) { return list[Array.prototype.indexOf.call(all, s)]; }));
    });
    track.appendChild(b);
    dots.appendChild(el('span'));
  });
  const all = Array.prototype.slice.call(track.children);
  wrap.appendChild(track);
  const prev = iconButton('back', 'karrow kprev', t('photoPrev'), function () { go(-1); });
  const next = iconButton('chev', 'karrow knext', t('photoNext'), function () { go(1); });
  wrap.appendChild(prev);
  wrap.appendChild(next);
  wrap.appendChild(dots);
  let cur = -1;
  function slides() { return Array.prototype.slice.call(track.children); }
  function pos() { return track.clientWidth ? Math.round(track.scrollLeft / track.clientWidth) : 0; }
  function go(d) { track.scrollBy({ left: d * track.clientWidth, behavior: 'smooth' }); }
  function show() {
    const s = slides();
    const k = Math.max(0, Math.min(s.length - 1, pos()));
    // Загружаем текущее и соседнее фото — остальные, когда до них долистают
    [k, k + 1].forEach(function (j) { if (s[j]) kpLoad(s[j].firstChild); });
    if (k === cur) return;
    cur = k;
    Array.prototype.forEach.call(dots.children, function (d, j) { d.className = j === k ? 'on' : ''; });
    s.forEach(function (b, j) { b.setAttribute('aria-label', fill(t('photoOf'), { n: j + 1, total: s.length })); });
    prev.disabled = k === 0;
    next.disabled = k === s.length - 1;
  }
  function drop(b) {
    const j = slides().indexOf(b);
    if (j === -1) return;
    track.removeChild(b);
    dots.removeChild(dots.children[j]);
    cur = -1;
    wrap.classList.toggle('one', track.children.length < 2);
    if (!track.children.length) {
      if (wrap.parentNode) wrap.parentNode.classList.remove('has-photo');
      if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
    } else show();
  }
  wrap.classList.toggle('one', list.length < 2);
  let raf = 0;
  track.addEventListener('scroll', function () {
    if (!raf) raf = requestAnimationFrame(function () { raf = 0; show(); });
  }, { passive: true });
  wrap.kpShow = show;
  return wrap;
}

// ── Карточка кружка: фото крупно вверху, листание, нажатие — на весь экран ──
const renderItemPlain = renderItem;
renderItem = function (screen, cat, item, app) {
  renderItemPlain(screen, cat, item, app);
  const list = clubPhotos(cat, item);
  const pic = screen.querySelector('.kpicbox');
  if (!pic || !list.length) return;
  pic.classList.add('has-photo');
  // На весь экран — оставшиеся фото (не загрузившиеся убраны из листания)
  const sl = kpSlider(list, '', function (k, left) {
    openViewer(left.map(function (i) { return { i: i }; }), k);
  });
  pic.insertBefore(sl, pic.firstChild);
  sl.kpShow();
};

// ── Главная: фото на плитках направлений, альбом после «Танымал» ──
const renderKidsHomePlain = renderKidsHome;
renderKidsHome = function (screen) {
  renderKidsHomePlain(screen);
  const cards = screen.querySelectorAll('.kdirs .cat-card');
  priceData.categories.forEach(function (cat, j) {
    const i = KIDS_PHOTOS.d[cat.id];
    if (i === undefined || !cards[j]) return;
    const box = el('span', 'kdph');
    cards[j].insertBefore(box, cards[j].firstChild);
    photoOver(box, i, '-t');
    cards[j].classList.add('has-photo');
    box.firstChild.addEventListener('error', function () { cards[j].classList.remove('has-photo'); });
  });
  // Плитки «Танымал» с фото — отметка на самой плитке (оформление текста поверх фото); фото не загрузилось — отметка снимается
  Array.prototype.forEach.call(screen.querySelectorAll('.kclub'), function (c) {
    const img = c.querySelector('.ill.has-photo > .kph');
    if (!img) return;
    c.classList.add('has-photo');
    img.addEventListener('error', function () { c.classList.remove('has-photo'); });
  });
  const album = albumList();
  if (!album.length) return;
  const sec = el('section', 'ksec kalbum');
  const head = el('div', 'ksec-head');
  head.appendChild(el('h2', null, t('albumTitle')));
  sec.appendChild(head);
  const grid = el('div', 'kalb-grid');
  album.slice(0, ALBUM_PREVIEW).forEach(function (x, k) {
    const b = el('button', 'kalb-cell');
    b.type = 'button';
    b.setAttribute('aria-label', loc(x.item.name) + ' — ' + fill(t('photoOf'), { n: k + 1, total: album.length }));
    b.appendChild(kpImg(x.i, '-t', function (img) { img.parentNode.removeChild(img); }));
    b.addEventListener('click', function () { openViewer(album, k); });
    grid.appendChild(b);
  });
  const all = el('a', 'kalb-all');
  all.href = '#/photos';
  all.appendChild(el('b', null, t('albumAll')));
  all.appendChild(el('small', null, fill(t('albumCount'), { n: album.length })));
  all.appendChild(svgNode(ICONS.chev));
  grid.appendChild(all);
  sec.appendChild(grid);
  const trust = screen.querySelector('.ktrust');
  const pop = screen.querySelector('.kpop');
  const after = trust || (pop && pop.parentNode.nextSibling);
  if (after) screen.insertBefore(sec, after); else screen.appendChild(sec);
};

// ── Экран #/photos: все фото кружков сеткой ──
const parseRoutePhotos = parseRoute;
parseRoute = function (hash) {
  if (/^#\/?photos\/?$/.test(hash || '')) return { screen: 'photos', key: 'photos' };
  return parseRoutePhotos(hash);
};
const renderHomePhotos = renderHome;
renderHome = function (screen) {
  if (!(currentRoute && currentRoute.screen === 'photos')) return renderHomePhotos(screen);
  screen.classList.add('kids', 'kphotos');
  screen.appendChild(backLink('#/', 'home', t('home')));
  const album = albumList();
  const h = el('div', 'kphotos-head');
  h.appendChild(el('h1', null, t('albumTitle')));
  h.appendChild(el('p', null, fill(t('albumCount'), { n: album.length })));
  screen.appendChild(h);
  const grid = el('div', 'kphotos-grid');
  album.forEach(function (x, k) {
    const b = stagger(el('button', 'kalb-cell'), k);
    b.type = 'button';
    b.setAttribute('aria-label', loc(x.item.name) + ' — ' + fill(t('photoOf'), { n: k + 1, total: album.length }));
    b.appendChild(kpImg(x.i, '-t', function (img) { img.parentNode.removeChild(img); }));
    b.addEventListener('click', function () { openViewer(album, k); });
    grid.appendChild(b);
  });
  screen.appendChild(grid);
  document.title = t('albumTitle') + ' · ' + company.name;
};

// ── Просмотр на весь экран: листание, крестик, Esc, свайп вниз, системная «Назад»; в альбоме — подпись-ссылка на кружок ──
let kViewer = null;
let kViewerOpener = null;
let kViewerThen = null;

function openViewer(list, start) {
  if (kViewer || !list.length) return;
  kViewerOpener = document.activeElement;
  const box = el('div', 'kview');
  box.setAttribute('role', 'dialog');
  box.setAttribute('aria-modal', 'true');
  box.setAttribute('aria-label', t('albumTitle'));
  const stage = el('div', 'kv-stage');
  const track = el('div', 'kv-track');
  list.forEach(function (x) {
    const s = el('div', 'kv-slide');
    const img = kpImg(x.i, '', function (im) { im.classList.add('is-broken'); }, true);
    img.className = 'kv-img';
    img.style.objectPosition = '';
    s.appendChild(img);
    track.appendChild(s);
  });
  stage.appendChild(track);
  box.appendChild(stage);
  const top = el('div', 'kv-top');
  const count = el('span', 'kv-count num');
  top.appendChild(count);
  const close = iconButton('close', 'kv-close', t('close'), function () { closeViewer(); });
  top.appendChild(close);
  box.appendChild(top);
  const prev = iconButton('back', 'karrow kprev', t('photoPrev'), function () { go(-1); });
  const next = iconButton('chev', 'karrow knext', t('photoNext'), function () { go(1); });
  box.appendChild(prev);
  box.appendChild(next);
  const cap = el('a', 'kv-cap');
  const capName = el('span');
  cap.appendChild(capName);
  cap.appendChild(svgNode(ICONS.chev));
  cap.addEventListener('click', function (e) {
    e.preventDefault();
    const href = cap.getAttribute('href');
    closeViewer(false, function () { location.hash = href; });
  });
  box.appendChild(cap);
  let cur = -1;
  function pos() { return track.clientWidth ? Math.round(track.scrollLeft / track.clientWidth) : 0; }
  function go(d) { track.scrollBy({ left: d * track.clientWidth, behavior: 'smooth' }); }
  function show() {
    const k = Math.max(0, Math.min(list.length - 1, pos()));
    [k - 1, k, k + 1].forEach(function (j) { if (track.children[j]) kpLoad(track.children[j].firstChild); });
    if (k === cur) return;
    cur = k;
    count.textContent = fill(t('photoOf'), { n: k + 1, total: list.length });
    prev.disabled = k === 0;
    next.disabled = k === list.length - 1;
    const x = list[k];
    cap.hidden = !x.item;
    if (x.item) {
      cap.href = itemHash(x.cat, x.item);
      capName.textContent = loc(x.item.name);
    }
  }
  box.classList.toggle('one', list.length < 2);
  let raf = 0;
  track.addEventListener('scroll', function () {
    if (!raf) raf = requestAnimationFrame(function () { raf = 0; show(); });
  }, { passive: true });
  // Свайп вниз — закрыть (фото уезжает вслед за пальцем)
  let sy = null, sx = 0, dy = 0;
  stage.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { sy = null; return; }
    sy = e.touches[0].clientY;
    sx = e.touches[0].clientX;
    dy = 0;
  }, { passive: true });
  stage.addEventListener('touchmove', function (e) {
    if (sy === null) return;
    const ddy = e.touches[0].clientY - sy, ddx = e.touches[0].clientX - sx;
    if (dy === 0 && Math.abs(ddx) > Math.abs(ddy)) { sy = null; return; }
    dy = Math.max(0, ddy);
    stage.style.transform = 'translateY(' + dy + 'px)';
    box.style.setProperty('--kv-fade', String(Math.max(0.3, 1 - dy / 400)));
  }, { passive: true });
  stage.addEventListener('touchend', function () {
    if (sy === null) return;
    sy = null;
    if (dy > 90) closeViewer();
    else {
      stage.style.transform = '';
      box.style.removeProperty('--kv-fade');
    }
  });
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' || e.key === 'Esc') {
      e.preventDefault();
      closeViewer();
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault();
      go(e.key === 'ArrowLeft' ? -1 : 1);
    } else if (e.key === 'Tab') {
      const items = Array.prototype.filter.call(box.querySelectorAll('button, [href]'), function (n) { return !n.disabled && !n.hidden; });
      const first = items[0], last = items[items.length - 1];
      if (e.shiftKey ? document.activeElement === first : document.activeElement === last) {
        e.preventDefault();
        (e.shiftKey ? last : first).focus();
      }
    }
  });
  document.body.appendChild(box);
  kViewer = box;
  document.getElementById('app').setAttribute('aria-hidden', 'true');
  document.documentElement.style.overflow = 'hidden';
  track.scrollLeft = (start || 0) * track.clientWidth;
  show();
  try { history.pushState({ idx: currentIdx, kview: true }, ''); } catch (e) { /* без записи «Назад» не закроет окно */ }
  close.focus({ preventScroll: true });
}

// fromHistory — окно закрыла системная «Назад»; then — что сделать после закрытия (переход к кружку из подписи)
function closeViewer(fromHistory, then) {
  if (!kViewer) return;
  if (then) kViewerThen = then;
  if (!fromHistory && history.state && history.state.kview) {
    history.back(); // окно закроется в обработчике popstate
    return;
  }
  kViewer.parentNode.removeChild(kViewer);
  kViewer = null;
  document.getElementById('app').removeAttribute('aria-hidden');
  document.documentElement.style.overflow = '';
  const after = kViewerThen;
  kViewerThen = null;
  if (after) after();
  else if (kViewerOpener && document.contains(kViewerOpener)) kViewerOpener.focus({ preventScroll: true });
  kViewerOpener = null;
}

window.addEventListener('popstate', function () {
  if (kViewer && !(history.state && history.state.kview)) closeViewer(true);
});
document.addEventListener('focusin', function (e) {
  if (kViewer && !kViewer.contains(e.target)) {
    const c = kViewer.querySelector('.kv-close');
    if (c) c.focus();
  }
});
// Страницу перезагрузили с открытым просмотром — убрать лишнюю запись истории (как у окна QR)
if (history.state && history.state.kview) history.back();

// ─────────── Кнопка «Назад» внизу (settings.backButton: true) ───────────
// Вставляет сборка (tools/build.js, место KIDS_BACK в конце kids.js) только детскому центру с backButton; без настройки кода нет.
// Экраны направления, «Ересектерге», кружка, «Все фото» и программы (на главной кнопки нет). Круг слева:
//   есть нижняя панель (программа, «Пробное + Добавить», «Записаться») — кнопка в самой панели слева, видна всегда;
//   нет панели — плавает внизу слева и появляется, когда верхняя «‹ Басты бет» ушла за верх экрана.
// Нажатие = шаг назад по истории (как системная «Назад»); если сайт открыли сразу на этом экране — переход на главную,
// с сайта не уходим. Просмотр фото на весь экран (.kview) лежит поверх кнопки.
let kbackWatch = null;

function kbackClick(top) {
  if (routeKeys[currentIdx - 1]) history.back();
  else top.click();
}

const renderKback = render;
render = function (route, direction) {
  if (kbackWatch) { kbackWatch(); kbackWatch = null; }
  renderKback(route, direction);
  if (route.screen === 'home') return;
  const app = document.getElementById('app');
  const screen = app.querySelector('.screen');
  const top = screen.querySelector('.back');
  if (!top) return;
  const btn = el('button', 'kback');
  btn.type = 'button';
  btn.setAttribute('aria-label', t('back'));
  btn.appendChild(svgNode(ICONS.back));
  btn.addEventListener('click', function () { kbackClick(top); });
  const inner = app.querySelector('.kbar .kbar-in');
  if (inner) {
    btn.classList.add('in-bar');
    inner.insertBefore(btn, inner.firstChild);
    return;
  }
  screen.classList.add('has-kback');
  btn.classList.add('is-hidden');
  if (!direction) btn.style.animation = 'none';
  app.appendChild(btn);
  // Видна, когда верхняя ссылка целиком выше экрана
  function show(gone) { btn.classList.toggle('is-hidden', !gone); }
  if (window.IntersectionObserver) {
    const io = new IntersectionObserver(function (es) {
      const e = es[es.length - 1];
      show(!e.isIntersecting && e.boundingClientRect.bottom <= 0);
    });
    io.observe(top);
    kbackWatch = function () { io.disconnect(); };
  } else {
    const onScroll = function () { show(top.getBoundingClientRect().bottom <= 0); };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    kbackWatch = function () { window.removeEventListener('scroll', onScroll); };
  }
};

init();
</script>
